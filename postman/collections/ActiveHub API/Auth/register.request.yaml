$kind: http-request
method: POST
url: '{{base_url}}/register'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Test User",
      "email": "user@example.com",
      "password": "password123",
      "password_confirmation": "password123"
    }
