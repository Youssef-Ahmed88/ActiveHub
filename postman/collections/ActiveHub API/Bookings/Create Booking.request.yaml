$kind: http-request
url: "{{base_url}}/bookings"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "court_id": 1,
      "start_time": "2026-04-24 10:00:00",
      "end_time": "2026-04-24 11:00:00"
    }
auth:
  type: bearer
  credentials:
    token: "{{bearer_token}}"
order: 1000
