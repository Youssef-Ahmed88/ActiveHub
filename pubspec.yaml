name: flutter_complete_project
description: ActiveHub - Sports Booking App
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  build_runner: ^2.10.5
  # State management
  flutter_bloc: ^9.1.1
  # Code generator
  freezed: ^3.2.4
  freezed_annotation: ^3.1.0
  # Dependency injection
  get_it: ^9.2.0
  # JSON
  json_serializable: ^6.12.0
  json_annotation: ^4.10.0
  # Networking
  dio: ^5.9.1
  retrofit: ^4.9.2
  retrofit_generator: ^10.2.1
  pretty_dio_logger: ^1.4.0
  # Screen util
  flutter_screenutil: ^5.9.3
  # Network images
  cached_network_image: ^3.4.1
  # Storage
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.0.0
  # Shimmer loading
  shimmer: ^3.0.0
  firebase_core: ^4.7.0
  flutter_rating_bar: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/