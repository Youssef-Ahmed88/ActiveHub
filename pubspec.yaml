name: flutter_complete_project
description: ActiveHub - Sports Booking App
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.1.1

  # Dependency Injection
  get_it: ^9.2.0

  # Networking
  dio: ^5.9.1
  retrofit: ^4.9.2
  http: ^1.2.1
  pretty_dio_logger: ^1.4.0

  # JSON
  json_annotation: ^4.10.0

  # Storage
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.0.0

  # UI
  flutter_screenutil: ^5.9.3
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_rating_bar: ^4.0.1

  # Firebase
  firebase_core: ^4.7.0

  # Maps & Location
  google_maps_flutter: ^2.17.0
  geolocator: ^11.0.0
  permission_handler: ^11.0.0

  # Deep Links
  app_links: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.10.5
  freezed: ^3.2.4
  freezed_annotation: ^3.1.0
  json_serializable: ^6.12.0
  retrofit_generator: ^10.2.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/